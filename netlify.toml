# Netlify deploy config for the Cabinetmaker static SPA.
# (Vercel users: an equivalent vercel.json can mirror these rules.)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA + hash routing: serve index.html for any path that isn't a real file.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (no backend, no third-party origins).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# Vite emits content-hashed asset filenames — safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The HTML shell must never be cached, so new deploys are picked up.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
